<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ToM+ Manual</title>

    <link rel="stylesheet" href="css/style.css">

    <script defer src="js/app.js"></script>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="brand-row">

                <div class="brand">

                    <div class="brand-icon">
                        T+
                    </div>

                    <div>

                        <div class="brand-title">
                            ToM+ Manual
                        </div>

                        <div class="brand-subtitle">
                            Version 2.0 · Firmware 2.4
                        </div>

                    </div>

                </div>

                <button
                    id="mobile-nav-toggle"
                    class="mobile-nav-toggle"
                    type="button"
                    aria-label="Toggle sections"
                    aria-expanded="false"
                >
                    ☰
                </button>

            </div>

        </div>


        <!-- Language and theme controls -->

        <div class="controls">

            <div class="control-group">

                <label for="language-select">
                    Language
                </label>

                <select id="language-select">

                    <option value="en">
                        🇬🇧 English
                    </option>

                    <option value="de">
                        🇩🇪 Deutsch
                    </option>

                    <option value="fr">
                        🇫🇷 Français
                    </option>

                </select>

            </div>


            <button
                id="theme-toggle"
                class="theme-toggle"
                type="button"
            >

                <span class="theme-icon">
                    🌙
                </span>

                <span id="theme-text">
                    Dark mode
                </span>

            </button>

        </div>


        <!-- Search -->

        <div class="search-container">

            <input
                type="text"
                id="search-input"
                placeholder="Search sections..."
            >

        </div>


        <!-- Navigation generated automatically -->

        <nav id="sidebar-navigation">

            <!-- JavaScript will generate this -->

        </nav>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="main-content">

        <div class="progress-bar">

            <div id="progress"></div>

        </div>


        <article id="documentation-content">

            <div class="loading">

                Loading documentation...

            </div>

        </article>

    </main>

</div>

</body>
</html>
